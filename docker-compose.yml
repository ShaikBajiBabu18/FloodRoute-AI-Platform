version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: floodroute-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: floodroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: floodroute-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: floodroute-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/floodroute?schema=public
      - JWT_SECRET=floodroute_jwt_secret_key_india_disaster_2026_secure
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
      - ADMIN_URL=http://localhost:5174
      - DEMO_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: floodroute-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: floodroute-admin
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - server

volumes:
  postgres_data:
