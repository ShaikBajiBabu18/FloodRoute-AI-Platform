services:
  # 1. Central Express API Gateway
  - type: web
    name: floodroute-gateway
    env: node
    plan: starter
    buildCommand: npm install && npm run build --workspace=@floodroute/shared && npm run build --workspace=@floodroute/server && npx prisma generate --schema=./prisma/schema.postgresql.prisma
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: floodroute-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: floodroute-ai-service
          property: host
      - key: CLIENT_URL
        value: https://floodroute.vercel.app
      - key: ADMIN_URL
        value: https://admin-floodroute.vercel.app

  # 2. FastAPI AI Neural Vision Service
  - type: web
    name: floodroute-ai-service
    env: python
    plan: starter
    rootDir: apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000

databases:
  - name: floodroute-postgres
    plan: starter
    databaseName: floodroute
    user: floodroute_user
